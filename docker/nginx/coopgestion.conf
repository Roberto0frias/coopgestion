# Nginx para COOPGESTION (producción).
# Termina HTTPS, sirve archivos estáticos y pasa las peticiones dinámicas a Gunicorn.

upstream coopgestion_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Redirige todo a HTTPS salvo el reto de renovación del certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certificados;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certificados/fullchain.pem;
    ssl_certificate_key /etc/nginx/certificados/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Cabeceras de seguridad. Django también las emite; aquí se refuerzan.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/estaticos/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    # La bitácora interna no se expone nunca.
    location /admin/ {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://coopgestion_web;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://coopgestion_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
