# Docker Compose para PRODUCCIÓN (VPS Linux con Nginx y HTTPS).
#
# Uso:
#   cp .env.example .env      # y completar los valores reales
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Los secretos NO están en este archivo: se leen del .env del servidor.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coopgestion}
      POSTGRES_USER: ${POSTGRES_USER:-coopgestion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: America/Santo_Domingo
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - respaldos:/respaldos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coopgestion}"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      TZ: America/Santo_Domingo
    volumes:
      - media:/app/media
      - estaticos:/app/staticfiles
      - registros:/app/logs
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/coopgestion.conf:/etc/nginx/conf.d/default.conf:ro
      - estaticos:/var/www/estaticos:ro
      - media:/var/www/media:ro
      - ./docker/nginx/certificados:/etc/nginx/certificados:ro
    depends_on:
      - web

  # Respaldo diario cifrado de PostgreSQL. La restauración se prueba aparte
  # (ver docs/despliegue, Fase 7).
  respaldo:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - respaldos:/respaldos
      - ./scripts/respaldo:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do
         /scripts/respaldo_diario.sh || echo 'Fallo el respaldo';
         sleep 86400;
       done"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_postgres:
  respaldos:
  media:
  estaticos:
  registros:
