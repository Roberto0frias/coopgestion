name: Integración continua

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad, pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # IMPORTANTE: el servicio arranca con el superusuario «postgres», NO con el rol de la
    # aplicación. La imagen oficial de PostgreSQL crea POSTGRES_USER como SUPERUSUARIO, y
    # si se usara directamente como rol de la aplicación, el entorno de integración
    # continua no reproduciría el diseño de menor privilegio de desarrollo y producción.
    # La prueba test_usuario_de_aplicacion_no_es_superusuario detecta esa diferencia y
    # hace fallar el flujo, que es exactamente lo que debe ocurrir.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_admin
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          # Mismo puerto que el entorno local (PostgreSQL 16 portable en 5433).
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://coopgestion:coopgestion_dev@127.0.0.1:5433/coopgestion
      COOPGESTION_DB_HOST: 127.0.0.1
      COOPGESTION_DB_PORT: "5433"
      COOPGESTION_DB_NAME: coopgestion
      COOPGESTION_DB_USER: coopgestion
      COOPGESTION_DB_PASSWORD: coopgestion_dev

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Provisionar el rol de aplicación (menor privilegio)
        env:
          PGPASSWORD: postgres_admin
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          # Mismo diseño que scripts/entorno/pg_init.ps1 en local:
          # coopgestion es NOSUPERUSER y NOCREATEROLE; CREATEDB solo para la base de pruebas.
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE coopgestion LOGIN PASSWORD 'coopgestion_dev'
              NOSUPERUSER NOCREATEROLE CREATEDB;
          CREATE DATABASE coopgestion OWNER coopgestion ENCODING 'UTF8' TEMPLATE template0;
          SQL

          psql -h 127.0.0.1 -p 5433 -U postgres -d coopgestion -v ON_ERROR_STOP=1 \
              -c "ALTER SCHEMA public OWNER TO coopgestion;"

          echo "Privilegios del rol de aplicación:"
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -tAc \
              "SELECT rolname || ' super=' || rolsuper || ' createdb=' || rolcreatedb ||
                      ' createrole=' || rolcreaterole
               FROM pg_roles WHERE rolname = 'coopgestion';"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen --dev

      - name: Revisar el estilo (ruff)
        run: uv run ruff check .

      - name: Revisar el formato (black)
        run: uv run black --check .

      - name: Comprobar que no falten migraciones
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Revisar el proyecto (django check --deploy)
        run: uv run python manage.py check --deploy --fail-level WARNING
        continue-on-error: true

      - name: Pruebas con cobertura
        run: uv run pytest -q --cov=apps --cov-report=term-missing --cov-report=xml

      # El requisito del 90 % aplica a los módulos de cálculo. Se verifica aparte y de
      # forma estricta, con un umbral más alto que el global.
      - name: Cobertura estricta de los módulos de cálculo
        run: >
          uv run pytest tests/test_dinero.py tests/core/test_validators.py -q
          --cov=apps.core.dinero --cov-fail-under=95 --cov-report=term-missing

      - name: Guardar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
          if-no-files-found: ignore
