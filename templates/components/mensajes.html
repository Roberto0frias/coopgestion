{% if messages %}
  <div class="mb-4 space-y-2">
    {% for mensaje in messages %}
      <div class="rounded-md border px-4 py-3 text-sm
        {% if mensaje.tags == 'success' %}border-emerald-300 bg-emerald-50 text-emerald-900
        {% elif mensaje.tags == 'error' %}border-red-300 bg-red-50 text-red-900
        {% elif mensaje.tags == 'warning' %}border-amber-300 bg-amber-50 text-amber-900
        {% else %}border-slate-300 bg-white text-slate-700{% endif %}">
        {{ mensaje }}
      </div>
    {% endfor %}
  </div>
{% endif %}
