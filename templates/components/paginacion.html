{% if is_paginated %}
  <nav class="mt-4 flex items-center justify-between border-t border-slate-200 pt-3 text-sm">
    <div class="text-slate-600">
      Página {{ page_obj.number }} de {{ paginator.num_pages }}
      · {{ paginator.count }} registro{{ paginator.count|pluralize }}
    </div>
    <div class="flex gap-2">
      {% if page_obj.has_previous %}
        <a class="boton-secundario" href="{% querystring page=page_obj.previous_page_number %}">
          Anterior
        </a>
      {% endif %}
      {% if page_obj.has_next %}
        <a class="boton-secundario" href="{% querystring page=page_obj.next_page_number %}">
          Siguiente
        </a>
      {% endif %}
    </div>
  </nav>
{% endif %}
