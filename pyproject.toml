[project]
name = "coopgestion-core"
version = "0.1.0"
description = "Sistema interno de gestión para COOPGESTION (cooperativa de ahorro y crédito)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.3",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "argon2-cffi>=23.1",
    "django-q2>=1.7",
    "openpyxl>=3.1",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "black>=24.10",
]

[tool.uv]
# Proyecto "virtual": aún no es un paquete distribuible, solo un entorno de trabajo.
package = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Permite importar "apps.*" desde la raíz del proyecto sin instalar el paquete.
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "-ra -q --strict-markers"
markers = [
    "entorno: verifica la infraestructura (PostgreSQL, codificación, bloqueos)",
    "calculos: verifica aritmética financiera (interés, amortización, mora, redondeo)",
]

[tool.coverage.run]
branch = true
source = ["apps"]
omit = ["*/migrations/*", "*/management/commands/*"]

[tool.coverage.report]
# Umbral global de la fase. El requisito del 90 % aplica a los módulos de cálculo y se
# verifica por separado en la integración continua sobre apps.core.dinero.
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "tests"]
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "RET", "SIM",
    "T20", "ARG", "PTH", "RUF", "DJ", "S", "PL",
]
ignore = [
    "PLR0913",   # demasiados argumentos: inevitable en servicios financieros explícitos
    "PLR2004",   # números mágicos en pruebas
    "S101",      # assert en pruebas
    "N818",      # en español el prefijo "Error" es la convención (ErrorMonetario)
    # Django define atributos mutables de clase en Meta (ordering, fields, permissions)
    # y en los formularios (error_messages). Es el patrón oficial del framework.
    "RUF012",
    # Importaciones locales deliberadas para romper ciclos entre aplicaciones
    # (forms -> services, apps.ready -> signals, models -> permisos).
    "PLC0415",
]

# Símbolos matemáticos intencionales en documentación y fórmulas en español.
allowed-confusables = ["×", "→", "≥", "≤", "≠", "≈", "Σ", "·", "–", "—", "«", "»", "“", "”", "’"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S105", "S106", "PLR0915",
    # Las fixtures llevan argumentos que pytest inyecta aunque no se usen directamente
    # (por ejemplo ``db``), y las firmas de los métodos de Django son fijas.
    "ARG001", "ARG002",
]
# Firmas impuestas por el framework: no se pueden cambiar ni acortar.
"*/management/commands/*" = ["ARG002"]  # handle(self, *args, **options)
"*/models.py" = ["ARG002"]              # save(self, *args, **kwargs), delete(...)
"*/forms.py" = ["ARG002"]               # save(self, commit=True)
"*/views.py" = ["ARG002"]               # get(self, request), get_object(self, queryset)
"*/backends.py" = ["ARG001", "ARG002"]  # API de los backends de autenticación
"*/signals.py" = ["ARG001", "ARG002"]   # receptores de señales

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"
